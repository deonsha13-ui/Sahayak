services:
  - type: web
    name: sahayak-care
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: SAHAYAK_AUTO_LANGUAGE
        value: "1"
